<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Membership Renewal Reminder</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background-color: #e8710a; color: #ffffff; padding: 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .body { padding: 24px; color: #333333; }
        .greeting { font-size: 16px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 14px; }
        th { background-color: #fff4ec; color: #555555; width: 40%; }
        .cta { margin-top: 24px; padding: 16px; background-color: #fff4ec; border-left: 4px solid #e8710a; border-radius: 4px; font-size: 15px; color: #333333; }
        .footer { background-color: #fff4ec; text-align: center; padding: 16px; font-size: 13px; color: #777777; }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>Membership Renewal Reminder</h1>
    </div>

    <div class="body">
        <p class="greeting">Dear <span th:text="${memberName}">Member</span>,</p>

        <table>
            <tr>
                <th>Plan Name</th>
                <td th:text="${planName}">-</td>
            </tr>
            <tr>
                <th>Expiry Date</th>
                <td th:text="${endDate}">-</td>
            </tr>
            <tr>
                <th>Batch Name</th>
                <td th:text="${batchName}">-</td>
            </tr>
        </table>

        <div class="cta">
            Your membership expires in 2 days. Please renew now to continue enjoying GymApp benefits.
        </div>
    </div>

    <div class="footer">
        Thank you for being a valued member of GymApp!
    </div>

</div>
</body>
</html>
