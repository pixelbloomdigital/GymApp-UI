spring.application.name=email-service
server.port=9098
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Enable static resource serving
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**


spring.datasource.url=jdbc:mysql://localhost:3306/emaildb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.http.converter.json=DEBUG

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=email-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Don't fail startup if Kafka broker is unavailable
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Twilio
twilio.account-sid=
twilio.auth-token=
twilio.whatsapp-from=whatsapp:+14155238886
# twilio.whatsapp-to is not used — To number comes dynamically from the member's phone in each event

# Notification retry settings
# Delay between Twilio retry attempts (ms) — uses exponential-ish backoff: interval * attemptNumber
notification.retry.interval-ms=5000
# How often the scheduled retry job runs (ms) — default: every 5 minutes
notification.retry.schedule-ms=300000

# Core-service base URL
core.service.url=http://localhost:9099

# Kafka producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer





