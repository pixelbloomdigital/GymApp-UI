spring.application.name=gym-core-service

server.port=9099

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.datasource.url=jdbc:mysql://localhost:3306/gym_customersdb?createDatabaseIfNotExist=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.http.converter.json=DEBUG

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=shipping-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Activity calorie map — kcal per hour per activity type (extensible via config)
activity.calories.map.ZUMBA=200
activity.calories.map.DANCE=150
activity.calories.map.FITNESS=180
activity.calories.map.YOGA=120
activity.calories.map.CROSSFIT=250
activity.calories.map.CARDIO=200
activity.calories.map.GENERAL=100
activity.calories.default-calories-per-hour=100

# Daily progress WhatsApp scheduler cron (default: 20:00 every day)
notification.daily-progress.schedule=0 0 20 * * *

# Gym location — used for GPS proximity validation (Haversine distance check)
gym.location.latitude=0.0
gym.location.longitude=0.0

# JWT — must match the secret in auth-service exactly
jwt.secretKey=pixelbloom-gym-secret-key-must-be-at-least-32-chars

# Payment service URL
payment.service.url=http://localhost:9096

# This service's own URL (used as callback URL sent to payment-service)
app.self.url=http://localhost:9099

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
