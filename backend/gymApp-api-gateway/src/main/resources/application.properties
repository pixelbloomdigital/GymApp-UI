spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Gym Auth Service — listed first so /oauth2/** and /login/oauth2/** are not swallowed by broader routes
spring.cloud.gateway.mvc.routes[0].id=gym-auth-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:2000
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**,/api/demo/**,/api/oauth2/**,/api/visitors/**,/api/leaves/**,/oauth2/**,/login/oauth2/**

# Gym Core Service
spring.cloud.gateway.mvc.routes[1].id=gym-core-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:9099
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/members/**,/api/memberships/**,/api/plans/**,/api/batches/**,/api/attendance/**,/api/dashboard/**,/api/performance/**,/api/diet-plans/**,/api/payments/callback,/api/trainer-attendance/**,/api/trainer-payroll/**

# Gym Payment Service
spring.cloud.gateway.mvc.routes[2].id=gym-payment-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:9096
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/payments/**

# Gym Public Info Service
spring.cloud.gateway.mvc.routes[3].id=gym-public-info-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:9097
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/public/**,/api/events/**,/api/costumes/**,/api/gym-profile/**

# Gym Email Service
spring.cloud.gateway.mvc.routes[4].id=gym-email-service
spring.cloud.gateway.mvc.routes[4].uri=http://localhost:9098
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/announcements/**

# Gym Multimedia Service
spring.cloud.gateway.mvc.routes[5].id=gym-multimedia-service
spring.cloud.gateway.mvc.routes[5].uri=http://localhost:9095
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/media/**,/api/uploads/**
spring.cloud.gateway.mvc.routes[5].filters[0]=RewritePath=/api/(?<segment>.*),$/{segment}

