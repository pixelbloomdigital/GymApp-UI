spring.application.name=gymApp-multimedia-service
server.port=9095

# Public base URL used to build file URLs (goes through the API gateway)
app.media.base-url=http://localhost:8080/api/media/files

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gym_multimediadb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (same secret as other services)
jwt.secretKey=pixelbloom-gym-secret-key-must-be-at-least-32-chars
jwt.expiration=86400000

# Storage
storage.type=local
storage.local.upload-dir=./uploads

# S3 (optional, for production)
storage.s3.bucket=
storage.s3.region=
storage.s3.access-key=
storage.s3.secret-key=

# Multipart file size limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
