spring.application.name=payment-service

server.port=9096

spring.datasource.url=jdbc:mysql://localhost:3306/paymentDB?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.http.converter.json=DEBUG

# Razorpay credentials
razorpay.key-id=
razorpay.key-secret=
# Set this in Razorpay dashboard → Webhooks → Secret (optional for local testing)
razorpay.webhook-secret=

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Required when both spring-web and spring-webflux are on classpath
spring.mvc.pathmatch.use-suffix-pattern=false
