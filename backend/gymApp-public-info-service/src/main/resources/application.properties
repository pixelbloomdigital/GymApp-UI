spring.application.name=gym-public-info-service

server.port=9097

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.datasource.url=jdbc:mysql://localhost:3306/gym_publicdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# JWT secret — must match auth-service exactly
jwt.secretKey=pixelbloom-gym-secret-key-must-be-at-least-32-chars

# Payment service URL
payment.service.url=http://localhost:9096

# This service's own callback URL
app.self.url=http://localhost:9097

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
