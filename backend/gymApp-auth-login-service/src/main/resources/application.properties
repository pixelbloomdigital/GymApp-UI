spring.application.name=auth-server

server.port=2000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.datasource.url=jdbc:mysql://localhost:3306/gymauthdb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT config
jwt.secretKey=pixelbloom-gym-secret-key-must-be-at-least-32-chars
jwt.expiration=86400000

# Google OAuth2 — get these from https://console.cloud.google.com/
# Authorized redirect URI to add in Google Console:
#   http://localhost:2000/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
#spring.jackson.serialization.write-dates-as-timestamps=false



# Payment service integration
payment.service.url=http://localhost:9096
app.self.url=http://localhost:2000

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Twilio SMS — add your credentials from https://console.twilio.com
twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
twilio.sms-from=YOUR_TWILIO_PHONE_NUMBER
